spring.application.name=agent-orchestrator-service
server.port=8086

microservices.user.url=${USER_SERVICE_URL:http://localhost:8081}
microservices.shop.url=${SHOP_SERVICE_URL:http://localhost:8082}
microservices.product.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
microservices.order.url=${ORDER_SERVICE_URL:http://localhost:8084}
microservices.agent.url=${AGENT_SERVICE_URL:http://localhost:8085}

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=${microservices.user.url}/v3/api-docs

springdoc.swagger-ui.urls[1].name=Shop Service
springdoc.swagger-ui.urls[1].url=${microservices.shop.url}/v3/api-docs

springdoc.swagger-ui.urls[2].name=Product Service
springdoc.swagger-ui.urls[2].url=${microservices.product.url}/v3/api-docs

springdoc.swagger-ui.urls[3].name=Order Service
springdoc.swagger-ui.urls[3].url=${microservices.order.url}/v3/api-docs

springdoc.swagger-ui.urls[4].name=Agent Service
springdoc.swagger-ui.urls[4].url=${microservices.agent.url}/v3/api-docs

