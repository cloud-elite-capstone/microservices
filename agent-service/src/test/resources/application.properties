spring.datasource.url=jdbc:h2:mem:agentservice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Tests do not start the four downstream MCP servers
spring.ai.mcp.client.enabled=false
adapter.serpapi.api.key=test-serpapi-key
adapter.geocoder.url=https://nominatim.openstreetmap.org
adapter.serpapi.url=https://serpapi.com

microservices.product.url=http://localhost:8083
microservices.auth.id-token.enabled=false
app.cors.allowed-origins=http://localhost:3000

spring.ai.google.genai.api-key=test-key
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
