spring.application.name=agent-service
server.port=8085

spring.datasource.url=jdbc:h2:mem:agentservice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
shop.service.url=http://localhost:8082
user.service.url=http://localhost:8081
order.service.url=http://localhost:8084

# Google GenAI / Gemini / Vertex AI (Set GEMINI_API_KEY or GCP credentials before starting)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GCP_MODEL:gemini-2.0-flash}

orchestrator.url=${ORCHESTRATOR_SERVICE_URL:http://localhost:8086}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,${orchestrator.url}}