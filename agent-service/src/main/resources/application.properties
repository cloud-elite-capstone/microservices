spring.application.name=agent-service
server.port=8085

spring.datasource.url=${DB_URL:jdbc:postgresql://cartesian-postgres:5432/agent_db}
spring.datasource.username=${DB_USERNAME:cartesian}
spring.datasource.password=${DB_PASSWORD:cartesian}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Downstream services
microservices.product.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
microservices.auth.id-token.enabled=${ID_TOKEN_ENABLED:false}

# External adapters
adapter.geocoder.url=${GEOCODER_URL:https://nominatim.openstreetmap.org}
adapter.serpapi.url=${SERPAPI_URL:https://serpapi.com}
adapter.serpapi.api.key=${SERPAPI_API_KEY:}

# Google GenAI / Gemini / Vertex AI (Set GEMINI_API_KEY or GCP credentials before starting)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GCP_MODEL:gemini-3.1-flash-lite}

# MCP client — dynamic access to the four domain services
spring.ai.mcp.client.enabled=${MCP_ENABLED:true}
spring.ai.mcp.client.name=agent-service
spring.ai.mcp.client.type=SYNC

spring.ai.mcp.client.streamable-http.connections.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.shop-service.url=${SHOP_SERVICE_URL:http://localhost:8082}
spring.ai.mcp.client.streamable-http.connections.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
spring.ai.mcp.client.streamable-http.connections.order-service.url=${ORDER_SERVICE_URL:http://localhost:8084}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.mcp.require-confirmation=false
spring.ai.mcp.server.tools.require-confirmation=false