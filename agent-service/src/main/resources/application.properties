spring.application.name=agent-service
server.port=8085

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agent_db}
spring.datasource.username=${DB_USERNAME:cartesian}
spring.datasource.password=${DB_PASSWORD:cartesian}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

product.service.url=http://localhost:8083

# Google GenAI / Gemini / Vertex AI (Set GEMINI_API_KEY or GCP credentials before starting)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GCP_MODEL:gemini-3.1-flash-lite}

orchestrator.url=${ORCHESTRATOR_SERVICE_URL:http://localhost:8086}
microservices.auth.id-token.enabled=${ID_TOKEN_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,${orchestrator.url}}