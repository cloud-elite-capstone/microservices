spring.application.name=order-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://cartesian-postgres:5432/order_db}
spring.datasource.username=${DB_USERNAME:cartesian}
spring.datasource.password=${DB_PASSWORD:cartesian}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.ai.mcp.enabled=true
springdoc.ai.mcp.dashboard-enabled=true
spring.ai.mcp.server.protocol=STREAMABLE

springdoc.ai.mcp.guardrails.require-approval-for-mutating-tools=false