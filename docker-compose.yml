services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cartesian-postgres
    environment:
      POSTGRES_USER: cartesian
      POSTGRES_PASSWORD: cartesian
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartesian -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
