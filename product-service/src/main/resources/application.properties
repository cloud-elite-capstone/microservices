spring.application.name=product-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://cartesian-postgres:5432/product_db}
spring.datasource.username=${DB_USERNAME:cartesian}
spring.datasource.password=${DB_PASSWORD:cartesian}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

client.geocoder.url=https://nominatim.openstreetmap.org
client.serpapi.url=https://serpapi.com
client.agent.url=

orchestrator.url=${ORCHESTRATOR_SERVICE_URL:http://localhost:8086}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,${orchestrator.url}}