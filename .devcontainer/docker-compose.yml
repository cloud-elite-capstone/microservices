services:
  app:
    image: mcr.microsoft.com/devcontainers/base:trixie
    volumes:
      - ..:/workspace:cached
    networks:
      - cartesian-net
    command: sleep infinity
  postgres:
    image: postgis/postgis:18-3.6-alpine
    container_name: cartesian-postgres
    environment:
      POSTGRES_USER: cartesian
      POSTGRES_PASSWORD: cartesian
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cartesian-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartesian -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
networks:
  cartesian-net:
    driver: bridge
volumes:
  pgdata:
