services:
  app:
    image: mcr.microsoft.com/devcontainers/base:trixie
    volumes:
      - /workspace:/workspace:cached
    networks:
      - cartesian-net
    command: sleep infinity
  postgres:
    build: ./postgres
    container_name: cartesian-postgres
    environment:
      POSTGRES_USER: cartesian
      POSTGRES_PASSWORD: cartesian
      POSTGRES_MULTIPLE_DATABASES: user_db,shop_db,product_db,order_db,agent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - cartesian-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartesian"]
      interval: 5s
      timeout: 5s
      retries: 10
networks:
  cartesian-net:
    driver: bridge
volumes:
  pgdata:
